services:
  - type: web
    name: devilbeats-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.production.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: devilbeats-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
databases:
  - name: devilbeats-db
    databaseName: devilbeats
    user: devilbeats
